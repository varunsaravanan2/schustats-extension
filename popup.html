<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #141414;
      color: #eee;
      padding: 16px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
      color: #d62c41;
    }
    .row {
      margin-bottom: 10px;
      font-size: 13px;
    }
    .label {
      color: #999;
      display: block;
      margin-bottom: 2px;
    }
    .value {
      color: #fff;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #d62c41;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>SchuStats Update Monitor</h1>

  <div class="row">
    <span class="label">Last known "Last Updated" date</span>
    <span class="value" id="lastUpdatedDate">—</span>
  </div>

  <div class="row">
    <span class="label">Last checked</span>
    <span class="value" id="lastChecked">—</span>
  </div>

  <div class="row">
    <span class="label">Status</span>
    <span class="value" id="lastStatus">—</span>
  </div>

  <button id="checkNowBtn">Check Now</button>
  <div id="status"></div>

  <div class="row" style="margin-top: 14px;">
    <span class="label">Debug: page text snippet</span>
    <div id="lastSnippet" style="
      font-size: 11px;
      color: #999;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 120px;
      overflow-y: auto;
      background: #1c1c1c;
      padding: 8px;
      border-radius: 4px;
      margin-top: 4px;
    "></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
