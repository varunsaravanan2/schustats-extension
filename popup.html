<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #161616;
      --line: #2a2a2a;
      --text: #ececec;
      --muted: #8a8a8a;
      --accent: #d62c41;
      --green: #4cc38a;
      --amber: #e0a43a;
      --red: #ef5a6b;
    }
    body {
      width: 290px;
      margin: 0;
      padding: 14px 16px 12px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--muted);
      font-size: 12px;
    }
    header img { width: 16px; height: 16px; }
    #lastUpdatedDate {
      margin: 14px 0 2px;
      font-size: 20px;
      font-weight: 650;
    }
    #stateLine {
      font-size: 12px;
      color: var(--muted);
    }
    #stateLine.found { color: var(--green); }
    #stateLine.waiting { color: var(--amber); }
    #stateLine.error { color: var(--red); }
    dl {
      margin: 14px 0 0;
      border-top: 1px solid var(--line);
    }
    dl div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
    }
    dt { color: var(--muted); flex-shrink: 0; }
    dd {
      margin: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    dd .sub { color: var(--muted); }
    #lastStatus {
      margin: 10px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 7px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:disabled { opacity: 0.6; cursor: default; }
    #status {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon16.png" alt="" />
    SchuStats Update Monitor
  </header>

  <div id="lastUpdatedDate">—</div>
  <div id="stateLine"></div>

  <dl>
    <div>
      <dt>Last checked</dt>
      <dd><span id="lastCheckedAgo">—</span> <span class="sub" id="lastChecked"></span></dd>
    </div>
    <div>
      <dt>Next check</dt>
      <dd id="nextCheck">—</dd>
    </div>
  </dl>
  <p id="lastStatus">—</p>

  <button id="checkNowBtn">Check now</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
